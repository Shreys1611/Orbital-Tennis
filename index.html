<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Tennis</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="killfeed-ui"></div>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Main Menu -->
        <div id="menu-screen" class="ui-layer">
            <h1>Orbital Tennis</h1>

            <div class="setting-row">
                <span class="label">Total Players</span>
                <div class="value-control">
                    <button class="btn-small" onclick="adjustTotal(-1)">-</button>
                    <span id="total-display" style="width: 20px; text-align: center;">4</span>
                    <button class="btn-small" onclick="adjustTotal(1)">+</button>
                </div>
            </div>

            <div class="setting-row">
                <span class="label">Humans</span>
                <div class="value-control">
                    <button class="btn-small" onclick="adjustHumans(-1)">-</button>
                    <span id="human-display" style="width: 20px; text-align: center;">1</span>
                    <button class="btn-small" onclick="adjustHumans(1)">+</button>
                </div>
            </div>

            <div class="setting-row">
                <span class="label">Bot Difficulty</span>
                <select id="bot-difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                    <option value="impossible">IMPOSSIBLE</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="label">Game Mode</span>
                <select id="game-mode">
                    <option value="standard" selected>Standard</option>
                    <option value="flip">Flip Zone</option>
                    <option value="portal">Portals</option>
                    <option value="speed">Speed Zones</option>
                    <option value="chaos">Chaos Mode</option>
                    <option value="inverse">Inverse Mode</option>
                </select>
            </div>

            <div class="tutorial">
                Game moves to <strong>LOBBY</strong> first.<br>
                Press your <strong>HIT</strong> key to Ready Up.<br>
                Wait for Countdown.<br>
            </div>

            <button class="btn-main" onclick="showNameSetup()">ENTER LOBBY</button>
        </div>

        <!-- Name Setup -->
        <div id="name-setup-screen" class="ui-layer hidden">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">SETUP NAMES</h1>

            <div id="name-inputs-container"
                style="max-height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 20px;">
            </div>

            <div style="display: flex; gap: 15px;">
                <button class="btn-main" style="background: #475569; padding: 10px 20px; font-size: 1rem;"
                    onclick="showMenu()">BACK</button>
                <button class="btn-main" style="padding: 10px 30px; font-size: 1.2rem;" onclick="goToLobby()">START
                    GAME</button>
            </div>
        </div>

        <!-- Game Over -->
        <div id="game-over-screen" class="ui-layer hidden">
            <div id="winner-text">Player 1 Wins!</div>

            <div id="leaderboard-container"
                style="display: none; background: rgba(15, 23, 42, 0.9); border: 2px solid #334155; border-radius: 10px; padding: 20px; margin: 15px 0; width: 85%; max-width: 500px; max-height: 50vh; overflow-y: auto;">
                <div
                    style="background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #ef4444;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px;">
                        <span style="color: #94a3b8; font-weight: bold; font-size: 12px; letter-spacing: 1px;">PEAK BALL
                            SPEED</span>
                        <span id="max-speed-display"
                            style="color: #ef4444; font-weight: 900; font-size: 18px; text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);">1.0x</span>
                    </div>

                    <div
                        style="width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; margin-bottom: 8px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);">
                        <div id="max-speed-bar"
                            style="height: 100%; width: 0%; background: linear-gradient(90deg, #facc15, #ef4444); transition: width 1s ease-out;">
                        </div>
                    </div>

                    <div style="text-align: right; color: #cbd5e1; font-size: 12px;">
                        Achieved by: <span id="max-speed-player" style="color: #fff; font-weight: bold;">-</span>
                    </div>
                </div>
                <table
                    style="width: 100%; color: white; border-collapse: collapse; text-align: center; font-size: 14px;">
                    <thead>
                        <tr style="border-bottom: 2px solid #06b6d4; color: #94a3b8;">
                            <th style="padding: 8px;">#</th>
                            <th style="padding: 8px;">NAME</th>
                            <th style="padding: 8px;">PTS</th>
                            <th style="padding: 8px;">KILLS</th>
                            <th style="padding: 8px;">PERFECTS</th>
                            <th style="padding: 8px;">DODGES</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                    </tbody>
                </table>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <button class="btn-main"
                    style="background: linear-gradient(135deg, #0ea5e9, #2563eb); font-size: 1rem; padding: 10px 20px; margin-top: 10px;"
                    onclick="showMenu()">MENU</button>
                <button class="btn-main"
                    style="background: linear-gradient(135deg, #a855f7, #7e22ce); font-size: 1rem; padding: 10px 20px; margin-top: 10px;"
                    onclick="toggleStats()">DETAILS</button>
                <button class="btn-main"
                    style="background: linear-gradient(135deg, #10b981, #059669); font-size: 1rem; padding: 10px 20px; margin-top: 10px;"
                    onclick="goToLobby()">REMATCH</button>
            </div>
        </div>

        <!-- Pause Button -->
        <button id="pause-btn" class="hidden" onclick="togglePause()">⏸</button>

        <!-- Pause Menu Overlay -->
        <div id="pause-screen" class="ui-layer hidden">
            <h1 style="color: #facc15;">PAUSED</h1>
            <button class="btn-main" onclick="togglePause()">RESUME</button>
            <button class="btn-main" onclick="restartGame()">RESTART LEVEL</button>
            <button class="btn-main" style="background: linear-gradient(135deg, #ef4444, #b91c1c);"
                onclick="showMenu()">MAIN MENU</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
